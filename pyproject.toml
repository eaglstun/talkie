[project]
name = "talkie"
version = "0.1.0"
description = "Inference library for Talkie 13B language models"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "talkie-lm" }]
dependencies = [
    "torch>=2.1.0",
    "tiktoken>=0.6.0",
    # This floor supports the PyTorch fork's Spin 0.18 / Click <8.4 toolchain;
    # standalone Talkie environments resolve newer Hub releases normally.
    "huggingface-hub>=1.16.1",
]

[project.optional-dependencies]
mlx = [
    "mlx>=0.32.2",
    "numpy",
    "safetensors>=0.7.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
talkie = "talkie.cli:main"
talkie-mlx = "talkie.mlx.cli:main"

[project.urls]
Repository = "https://github.com/talkie-lm/talkie"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/talkie"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
# CUDA wheels only make sense on Linux; on macOS (Apple Silicon) fall back to
# the default PyPI torch wheel, which ships MPS/CPU support.
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
